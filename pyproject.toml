[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illustrated-agents"
version = "0.1.0"
description = "The code for the book 'An Illustrated Guide to AI Agents'"
authors = [
  { name = "Maarten Grootendorst"},
  { name = "Jay Alammar"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.81.1",
    "ollama>=0.6.1",
    "pygments>=2.19.2",
    "rich>=14.3.2", 
    "mcp>=1.26.0"
]

[tool.uv.sources]
ilustrated-agents = { workspace = true }

[project.optional-dependencies]
jupyter = ["jupyterlab>=4.1.5", "ipywidgets>=8.1.8"]
all = ["illustrated-agents[jupyter]"]

[project.scripts]
tinyagent = "illustrated_agents.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110